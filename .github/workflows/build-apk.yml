name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias y copiar la web a Android
        run: |
          npm install
          npx cap sync android

      - name: Compilar APK (debug, instalable directamente)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FilaLab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FilaLab-apk
          path: FilaLab.apk
